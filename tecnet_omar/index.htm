<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reto: Generador de Contraseñas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="box">
    <h2>Reto: Generador de Contraseñas</h2>
    <p class="sub">  </p>

    <div class="campo">
      <label for="longitud">Longitud:</label>
      <input type="number" id="longitud" value="10" min="4" max="30">
    </div>

    <div class="opciones">
      <label><input type="checkbox" id="numeros" checked> Incluir números</label>
      <label><input type="checkbox" id="simbolos" checked> Incluir símbolos</label>
    </div>

    <button id="btn-generar">Generar Contraseña</button>

    <div class="resultado">
      <input type="text" id="resultado" readonly placeholder="Aquí saldrá tu clave">
      <button id="btn-copiar">Copiar</button>
    </div>
    <span id="mensaje"></span>
  </div>

  <script src="reto.js"></script>
</body>
</html>
