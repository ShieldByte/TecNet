<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestor de calificaciones</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="contenedor">

        <h1>Gestor de calificaciones</h1>

        <p class="descripcion">
            Registro de estudiantes.
        </p>

        <!-- Formulario -->
        <section class="formulario">

            <h2>Registrar estudiante</h2>

            <div class="campo">
                <label for="nombre">Nombre del estudiante</label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="..."
                >
            </div>

            <div class="campo">
                <label for="calificacion">Calificación</label>

                <input
                    type="number"
                    id="calificacion"
                    min="0"
                    max="10"
                    step="0.1"
                    placeholder="0 - 10"
                >
            </div>

            <button id="btnAgregar">
                Agregar estudiante
            </button>

            <p id="mensaje"></p>

        </section>


        <!-- Filtros -->
        <section class="filtros">

            <h2>Filtrar estudiantes</h2>

            <button class="btnFiltro" data-filtro="todos">
                Todos
            </button>

            <button class="btnFiltro" data-filtro="aprobados">
                Aprobados
            </button>

            <button class="btnFiltro" data-filtro="reprobados">
                Reprobados
            </button>

        </section>


        <!-- Tabla -->
        <section class="lista">

            <h2>Estudiantes registrados</h2>

            <table>

                <thead>

                    <tr>
                        <th>Nombre</th>
                        <th>Calificación</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>

                </thead>

                <tbody id="tablaEstudiantes">

                    <!-- Los estudiantes se agregarán con JavaScript -->

                </tbody>

            </table>

        </section>


        <!-- Promedio -->
        <section class="resumen">

            <h2>Resumen</h2>

            <p>
                Promedio general:
                <strong id="promedio">0.00</strong>
            </p>

            <p>
                Total de estudiantes:
                <strong id="totalEstudiantes">0</strong>
            </p>

        </section>

    </main>


    <script src="reto.js"></script>

</body>
</html>
